<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>目标关键词人群特征综合排名工具</title>


<style>
:root{
  --primary:#2563eb;--success:#16a34a;--warn:#d97706;--danger:#dc2626;
  --text:#1f2937;--muted:#6b7280;--bg:#f5f7fa;--card:#ffffff;--border:#e5e7eb;
  --sticky-h:48px;--nav-h:54px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;}
h1,h2,h3{margin:0;font-weight:600}
h1{font-size:20px}
h2{font-size:16px}
button,input,select{font-family:inherit;font-size:14px}
a{color:var(--primary);text-decoration:none}

.cdn-error{position:fixed;left:0;right:0;top:0;z-index:100;background:#fef2f2;border-bottom:1px solid var(--danger);
  color:#991b1b;padding:10px 24px;text-align:center;font-weight:600}
.cdn-error[hidden]{display:none}

.topbar{position:sticky;top:0;z-index:30;height:48px;background:#fff;border-bottom:1px solid var(--border);
  padding-top:constant(safe-area-inset-top);padding-top:env(safe-area-inset-top)}
.topbar-inner{height:48px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.app-title{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.topbar-right{display:flex;align-items:center;gap:8px;min-width:0;flex-shrink:0}
.chip{display:inline-block;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:#eef2ff;color:#3730a3;border-radius:999px;padding:3px 10px;font-size:12px}
.chip.file{background:#f3f4f6;color:#4b5563}

.wrap{max-width:1440px;margin:0 auto;padding:0 24px}

.control{position:sticky;top:48px;z-index:20;background:#fff;border-bottom:1px solid var(--border);box-shadow:0 2px 6px rgba(17,24,39,.04)}
.control-body{padding:12px 0 14px;display:flex;flex-direction:column;gap:10px}
.control-summary{display:none;height:48px;align-items:center;gap:10px}
.control-summary.show{display:flex}
.control.collapsed .control-body{display:none}
.sum-kw{font-weight:600}
.sum-status{color:var(--muted)}

.upload-card{border:1.5px dashed #c7d2fe;border-radius:12px;background:#f8faff;padding:14px 16px;
  display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap;transition:.15s}
.upload-card.drag{border-color:var(--primary);background:#eff6ff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.upload-card.disabled{opacity:.55}
.upload-main{display:flex;flex-direction:column;gap:2px;min-width:220px}
.upload-main strong{font-weight:600}
.upload-main span{color:var(--muted);font-size:12px}
.upload-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.file-pill{font-size:12px;color:#374151;background:#eef2ff;border-radius:8px;padding:4px 10px;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.kw-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.kw-row[hidden]{display:none}
.kw-row label{font-weight:600}
.kw-row select{width:240px;max-width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:#fff}
.kw-row .muted{color:var(--muted);font-size:12px}

.btn-row{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);
  background:#fff;color:var(--text);border-radius:8px;padding:10px 14px;min-height:40px;cursor:pointer;transition:.15s;
  -webkit-tap-highlight-color:transparent}
.btn:hover:not(:disabled){border-color:#cbd5e1;background:#f9fafb}
.btn:active:not(:disabled){transform:scale(.97);background:#f1f5f9}
.btn:disabled{cursor:not-allowed;opacity:.4;color:#9ca3af;background:#f9fafb}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover:not(:disabled){background:#1d4ed8;border-color:#1d4ed8}
.btn.primary:active:not(:disabled){background:#1d4ed8}
.btn.danger{border-color:#fecaca;color:var(--danger);background:#fff}
.btn.danger:hover:not(:disabled){background:#fef2f2}
.btn.danger:active:not(:disabled){background:#fee2e2}
.btn.ghost{border-color:#e5e7eb;background:#f9fafb;color:var(--primary);padding:8px 14px;min-height:36px;font-size:14px}
.btn.ghost:active:not(:disabled){background:#eff6ff}
.btn.sm{padding:7px 12px;font-size:14px;min-height:34px}

.error-bar{position:sticky;top:var(--sticky-h);z-index:15;margin-top:12px;border:1px solid var(--danger);border-radius:12px;background:#fef2f2;color:#991b1b;padding:12px 14px}
.error-bar[hidden]{display:none}
.error-bar .err-head{display:flex;align-items:flex-start;gap:10px}
.error-bar .err-icon{font-weight:700}
.error-bar .err-body{flex:1;min-width:0}
.error-bar .err-title{font-weight:600}
.error-bar .err-detail{font-size:13px;color:#7f1d1d;margin-top:2px;word-break:break-word}
.error-bar .err-actions{display:flex;gap:8px;flex-shrink:0}
.error-bar .btn{border-color:#fca5a5;color:#991b1b;background:#fff}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;color:#fff;
  padding:10px 18px;border-radius:999px;font-size:13px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast[hidden]{display:none}

.main{padding-top:12px;padding-bottom:calc(56px + env(safe-area-inset-bottom))}
.result-nav{position:sticky;top:var(--sticky-h);z-index:10;display:flex;gap:6px;padding:10px 12px;
  background:#fff;border-top:1px solid var(--border);border-bottom:1px solid var(--border);
  overflow-x:auto;scrollbar-width:thin;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.result-nav[hidden]{display:none}
.result-nav a{padding:8px 14px;border-radius:999px;color:var(--muted);white-space:nowrap;border:1px solid transparent;
  min-height:36px;display:inline-flex;align-items:center;flex-shrink:0}
.result-nav a.active{color:var(--primary);background:#eff6ff;border-color:#bfdbfe}
.result-nav a:focus-visible,.btn:focus-visible,th:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

.results{display:flex;flex-direction:column;gap:16px}
.empty-state{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:48px 24px;
  text-align:center;color:var(--muted)}

.card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(17,24,39,.05);padding:16px 18px;scroll-margin-top:calc(var(--sticky-h) + var(--nav-h) + 8px)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.card-head h2{font-size:16px}
.card-head .meta{color:var(--muted);font-size:12px}
.card-note{color:var(--muted);font-size:12px}

.warn-banner{background:#fffbeb;border:1px solid var(--warn);border-radius:10px;padding:10px 12px;color:#92400e;margin-bottom:14px}
.warn-banner[hidden]{display:none}
.warn-banner details summary{cursor:pointer}

.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.metric{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:#fbfcfe}
.metric .num{font-size:24px;font-weight:600;line-height:1.2}
.metric .lab{color:var(--muted);font-size:12px;margin-top:2px}
.metric .sub{color:#9ca3af;font-size:11px}
/* 标签独占一行居中，标题/昵称在其下完整展示：不截断，只在超长英文串处强制换行，避免撑破容器。 */
.tips-row{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0}
.tips-lab{flex:0 0 auto;white-space:nowrap;color:#6b7280;font-size:12px;background:#f3f4f6;border-radius:6px;padding:2px 8px}
.tips-kw{width:100%;max-width:100%;font-size:16px;font-weight:700;color:#111827;line-height:1.4;
  text-align:center;word-break:break-word;overflow-wrap:anywhere}
.tips-sub{color:#6b7280;font-size:12px}
.control-tips{padding-top:4px;border-top:1px dashed var(--border);margin-top:10px}

.kv{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;margin-bottom:10px}
.kv .k{color:var(--muted)}
.badge{display:inline-block;background:#f3f4f6;border-radius:6px;padding:1px 8px;font-size:12px;color:#374151}
.badge.warn{background:#fffbeb;color:#92400e}
.badge.err{background:#fef2f2;color:#991b1b}
.badge.ok{background:#f0fdf4;color:#166534}

.sub-title{font-size:14px;font-weight:600;margin:16px 0 8px}
.stats-table{width:100%;border-collapse:collapse;font-size:13px}
.stats-table th,.stats-table td{border-bottom:1px solid #eef0f3;padding:6px 8px;text-align:left}
.stats-table th{background:#f9fafb;color:#374151;font-weight:600;position:sticky;top:0}
.stats-table td.num{text-align:right;font-variant-numeric:tabular-nums}
.stats-table tr.zero td{color:#9ca3af}

details.anomaly{border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin-bottom:8px;background:#fbfcfe}
details.anomaly summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-size:13px}
details.anomaly summary .cnt{color:var(--muted)}
details.anomaly ul{margin:8px 0 0;padding-left:20px}
details.anomaly li{font-size:12px;color:#4b5563;word-break:break-word}
details.anomaly .truncate{font-size:12px;color:var(--muted);margin-top:6px}

.plain-list{margin:0;padding-left:18px;font-size:13px}
.plain-list li{line-height:1.8;word-break:break-word}
.method dl{margin:0;display:grid;grid-template-columns:160px 1fr;gap:8px 14px;font-size:13px}
.method dt{color:var(--muted)}
.method dd{margin:0}
@media (max-width:640px){.method dl{grid-template-columns:1fr} .method dd{margin-bottom:8px}}

.table-wrap{overflow:auto;-webkit-overflow-scrolling:touch;max-height:480px;border:1px solid var(--border);border-radius:10px;overscroll-behavior:contain}
.table-wrap.mixed{max-height:600px}
table.data-table{width:100%;border-collapse:collapse;font-size:14px;min-width:max-content}
table.data-table thead th{position:sticky;top:0;z-index:5;background:#f9fafb;border-bottom:1px solid var(--border);
  padding:10px 12px;text-align:left;white-space:nowrap;font-weight:600}
table.data-table thead th.sortable{cursor:pointer;user-select:none}
table.data-table thead th.sortable:hover{background:#eff6ff}
table.data-table thead th .arrow{color:var(--primary);font-size:11px;margin-left:4px}
table.data-table tbody td{padding:12px;border-bottom:1px solid #f1f3f5;vertical-align:middle}
table.data-table tbody tr:nth-child(even){background:#fcfcfd}
table.data-table tbody tr:active{background:#eff6ff}
table.data-table td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.data-table td.name{font-weight:500}
.hint-bar{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:8px 10px;font-size:12px;margin-bottom:10px}

.tag{display:inline-block;border-radius:999px;padding:2px 8px;font-size:12px;line-height:1.5;white-space:nowrap}
.q-hh{background:#dcfce7;color:#166534}
.q-hl{background:#dbeafe;color:#1e40af}
.q-lh{background:#ffedd5;color:#9a3412}
.q-ll{background:#f3f4f6;color:#4b5563}
.tgi-tag{background:#eef2ff;color:#3730a3;margin-left:4px}
.tag-note{font-size:11px;color:var(--muted);margin-left:4px}
.r-super{background:#ffedd5;color:#9a3412}
.r-normal{background:#dcfce7;color:#166534}
.r-dup{background:#fee2e2;color:#991b1b}
.r-miss{background:#f3f4f6;color:#4b5563}
.placeholder{color:#9ca3af}

.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid #bfdbfe;border-top-color:var(--primary);
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{display:flex;flex-direction:column;gap:10px}
.sk-line{height:14px;border-radius:6px;background:#eef1f5;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
.progress-track{height:6px;background:#eef2ff;border-radius:999px;overflow:hidden;margin:8px 0}
.progress-bar{height:100%;width:0;background:var(--primary);transition:width .2s}

@media (max-width:768px){
  .wrap{padding:0 12px}
  .btn-row .btn{flex:1 1 calc(50% - 6px)}
  .app-title{font-size:16px}
  .topbar-right .chip.file{display:none}
  .card{padding:14px 16px;border-radius:10px}
  .card-head{margin-bottom:8px}
  .results{gap:12px}
}
@media (max-width:480px){
  .card-head{flex-direction:column;align-items:flex-start;gap:4px}
  .card-head .meta{font-size:11px}
  .btn-row .btn{flex:1 1 calc(50% - 6px)}
}
</style>
</head>
<body>
<div id="cdnError" class="cdn-error" hidden="">依赖库加载失败，请检查网络后刷新页面</div>

<header class="topbar">
  <div class="wrap topbar-inner">
    <h1 class="app-title" id="pageTitle">综合排名</h1>
    <div class="topbar-right">
      <button class="btn ghost sm" id="backBtn">返回抓取</button>
      <button class="btn ghost sm" id="collapseBtn" aria-expanded="true">收起控制区</button>
    </div>
  </div>
</header>

<section class="control" id="control">
  <div class="wrap">
    <div class="control-body" id="controlBody">
      <div class="kw-row" id="kwRow" hidden="">
        <label for="kwSelect">关键词</label>
        <select id="kwSelect"></select>
        <span class="muted" id="kwCount"></span>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="reanalyzeBtn" disabled="">重新分析</button>
        <button class="btn" id="sampleBtn" hidden="">加载示例数据</button>
        <button class="btn" id="exportBtn" disabled="">导出结果</button>
        <button class="btn danger" id="clearBtn" disabled="">清空</button>
      </div>
      <div id="controlTips" class="control-tips" hidden=""></div>
    </div>
  </div>
</section>

<div class="wrap">
  <div class="error-bar" id="errorBar" role="alert" aria-live="assertive" hidden=""></div>
</div>

<main class="wrap main">
  <nav class="result-nav" id="resultNav" aria-label="结果区导航" hidden=""></nav>
  <section class="results" id="results">
    <div class="empty-state" id="emptyState">数据载入中…</div>
  </section>
</main>

<div class="toast" id="toast" hidden=""></div>

<script src="scoring.js"></script>
<script>
'use strict';

/* ============================ 全局常量 ============================ */
const MAX_UPLOAD_MB = 50;
const ENCODING_FFFD_MAX = 20;
const ENCODING_RATIO_MAX = 0.005;
const RANK_DISPLAY_LIMIT = 100;
const LIST_TRUNCATE = 20;
const ANOMALY_SAMPLE_MAX = 20;
const KEYWORD_NULL_RATIO_ALERT = 0.3;
const SEP = '\u0001';
const CONTENT_BLOCK = '用户内容浏览分布';
const UNLABELED_KW = '未标注关键词';
const SINGLE_KW = '单关键词';
const SAMPLE_SOURCE = '抖音指数_穿搭_人群分析.xlsx';
const STANDARD_BLOCKS = [
  '地域分布-城市',
  '地域分布-城市级别',
  '地域分布-省份',
  '年龄分布',
  '性别分布',
  CONTENT_BLOCK,
  '手机价格分布',
  '手机品牌分布'
];
const QUADRANT_TEXT = {
  HH: '重点机会',
  HL: '规模/强度驱动，需提升偏好',
  LH: '偏好驱动，适合精准渗透',
  LL: '优先级较低'
};
const QUADRANT_CLASS = { HH: 'q-hh', HL: 'q-hl', LH: 'q-lh', LL: 'q-ll' };

/* 无关键词列时从文件名推导关键词：
   - 标准格式：抖音指数_<关键词>_人群分析.xlsx → <关键词>
   - 纯关键词：'穿搭' → '穿搭'（兜底） */
function deriveKeywordFromName(name) {
  const base = String(name === null || name === undefined ? '' : name)
    .replace(/^.*[\\/]/, '')
    .replace(/\.(csv|xlsx|xls|json)$/i, '')
    .trim();
  if (base === '') return '';
  const patterns = [
    /^抖音指数[_\-\s]+([^_\-\s]+)[_\-\s]+人群分析$/,
    /^([^_\-\s]+)[_\-\s]+人群分析$/,
    /^抖音指数[_\-\s]+([^_\-\s]+)$/
  ];
  for (let i = 0; i < patterns.length; i++) {
    const m = base.match(patterns[i]);
    if (m && m[1].trim()) return m[1].trim();
  }
  // 兜底：如果传入本身就是纯关键词（没有「抖音指数/人群分析」前后缀），直接返回
  return base;
}

/* ============================ 运行时状态 ============================ */
const state = {
  status: 'idle',
  file: null,
  hasKeywordField: false,
  keywords: [],
  currentKeyword: '',
  pageType: '',
  clean: null,
  keywordMeta: null,
  resultCache: new Map(),
  sortState: new Map(),
  generation: 0,
  collapsed: true,
  activeReader: null,
  tableRegistry: new Map(),
  domIdMap: new Map(),
  activeNavObserver: null,
  _stickyOffsetCache: 102
};

/* ============================ 通用工具 ============================ */
let _collator = null;
function collator() {
  if (_collator) return _collator;
  try {
    _collator = new Intl.Collator('zh-Hans-CN');
  } catch (e1) {
    try {
      _collator = new Intl.Collator('zh');
    } catch (e2) {
      _collator = new Intl.Collator();
    }
  }
  return _collator;
}

function isFiniteNumber(v) {
  return typeof v === 'number' && isFinite(v);
}

function fmt(v, digits) {
  if (v === null || v === undefined || typeof v !== 'number' || !isFinite(v)) return '—';
  if (digits === 0) return String(Math.round(v));
  return v.toFixed(digits);
}

function esc(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function toHalfWidth(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/[\uFF01-\uFF5E]/g, function (c) {
      return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
    })
    .replace(/\u3000/g, ' ');
}

function stripBOM(s) {
  return String(s === null || s === undefined ? '' : s).replace(/^\uFEFF/, '');
}

function trimAll(s) {
  return String(s === null || s === undefined ? '' : s).replace(/^[\s\u3000]+|[\s\u3000]+$/g, '');
}

function normHeaderCell(s) {
  return trimAll(toHalfWidth(stripBOM(s))).toLowerCase();
}

function normCell(s) {
  return trimAll(toHalfWidth(stripBOM(s)));
}

function blankText(v) {
  return String(v === null || v === undefined ? '' : v).replace(/[\s\u3000]/g, '') === '';
}

function isBlankRow(cells) {
  for (let i = 0; i < cells.length; i++) {
    if (!blankText(cells[i])) return false;
  }
  return true;
}

function isoDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function cellToText(v, ctx) {
  if (v === null || v === undefined) return '';
  if (v instanceof Date) {
    if (isNaN(v.getTime())) return '';
    if (ctx) ctx.dateWarnings += 1;
    return isoDate(v);
  }
  if (typeof v === 'number' || typeof v === 'boolean') return String(v);
  if (typeof v === 'string') return v;
  try {
    return String(v);
  } catch (e) {
    return '';
  }
}

/* 数值解析固定流水线：去空白/千分位 → 记录 %/％ 尾缀（转半角之前）→ 全角转半角 → 去尾部 % → 严格正则 → parseFloat */
function parseNumericString(v) {
  const raw = v === null || v === undefined ? '' : String(v);
  let s = raw.replace(/[\s\u3000]/g, '').replace(/[,，]/g, '');
  const hadPct = s.endsWith('%') || s.endsWith('\uFF05');
  s = toHalfWidth(s);
  if (hadPct) s = s.replace(/%$/, '');
  if (!/^-?\d+(\.\d+)?$/.test(s)) {
    return { ok: false, value: NaN, hadPct: hadPct, raw: raw };
  }
  const num = parseFloat(s);
  if (!isFinite(num)) return { ok: false, value: NaN, hadPct: hadPct, raw: raw };
  return { ok: true, value: num, hadPct: hadPct, raw: raw };
}

function ascending(a, b) { return a - b; }

function err(code, message, detail) {
  return { code: code, message: message, detail: detail || '' };
}

/* ============================ 文件读取与解析 ============================ */
function readArrayBuffer(file) {
  return new Promise(function (resolve, reject) {
    const fr = new FileReader();
    state.activeReader = fr;
    fr.onload = function () { state.activeReader = null; resolve(fr.result); };
    fr.onerror = function () { state.activeReader = null; reject(err('READ_FAIL', '文件读取失败，请重新选择文件。')); };
    fr.onabort = function () { state.activeReader = null; reject({ aborted: true }); };
    try { fr.readAsArrayBuffer(file); } catch (e) { reject(err('READ_FAIL', '文件读取失败，请重新选择文件。')); }
  });
}

function decodeUtf8(buffer) {
  const bytes = new Uint8Array(buffer);
  const decoder = new TextDecoder('utf-8', { fatal: false });
  const textRaw = decoder.decode(bytes);
  const text = stripBOM(textRaw);
  /* 逐字符计数，避免为每个替换字符分配数组（大文件下更省内存） */
  let bad = 0;
  for (let i = 0; i < text.length; i++) {
    if (text.charCodeAt(i) === 0xFFFD) bad += 1;
  }
  return { text: text, bad: bad, length: text.length };
}

function checkEncoding(info, kind) {
  const ratio = info.length > 0 ? info.bad / info.length : 0;
  if (info.bad > ENCODING_FFFD_MAX || ratio > ENCODING_RATIO_MAX) {
    return err(kind === 'csv' ? 'CSV_ENCODING' : 'JSON_ENCODING',
      '检测到非 UTF-8 编码字符，请将 ' + (kind === 'csv' ? 'CSV' : 'JSON') + ' 另存为 UTF-8 编码后重试。');
  }
  return null;
}

async function parseCsv(text) {
  // 内联解析器（与原生注入路径 parseCsvText 一致），不依赖 PapaParse CDN。
  const rows = parseCsvText(text);
  if (!rows || rows.length === 0) {
    throw err('CSV_PARSE', 'CSV 解析失败：未获得有效数据。');
  }
  return rows;
}

async function parseExcel(buffer) {
  await new Promise(function (r) { setTimeout(r, 0); });
  if (typeof XLSX === 'undefined') {
    throw err('EXCEL_UNAVAILABLE', 'Excel 解析依赖未加载，暂不支持 .xlsx/.xls 文件；请改用 .csv 格式。');
  }
  let wb;
  try {
    wb = XLSX.read(new Uint8Array(buffer), { type: 'array', cellDates: true });
  } catch (e) {
    throw err('EXCEL_EMPTY', 'Excel 解析失败：' + String(e.message || e) + '。');
  }
  if (!wb.SheetNames || wb.SheetNames.length === 0) {
    throw err('EXCEL_NO_SHEET', 'Excel 未包含工作表，请检查文件。');
  }
  const sheetName = wb.SheetNames[0];
  const ws = wb.Sheets[sheetName];
  const merges = ws && ws['!merges'] ? ws['!merges'].length : 0;
  const json = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '', blankrows: false });
  if (!json || json.length === 0) {
    throw err('EXCEL_EMPTY', 'Excel 第一个工作表无数据，请检查文件。');
  }
  return { rows: json, sheetName: sheetName, merges: merges };
}

function objectArrayField(obj) {
  const keys = Object.keys(obj);
  for (let i = 0; i < keys.length; i++) {
    const val = obj[keys[i]];
    if (Array.isArray(val) && (val.length === 0 || val.every(function (x) { return x && typeof x === 'object' && !Array.isArray(x); }))) {
      return { key: keys[i], value: val };
    }
  }
  return null;
}

function jsonToRows(obj) {
  let arr;
  if (Array.isArray(obj)) {
    arr = obj;
    if (arr.length === 0) throw err('JSON_SHAPE', 'JSON 数组为空，请检查文件。');
    if (!arr.every(function (x) { return x && typeof x === 'object' && !Array.isArray(x); })) {
      throw err('JSON_SHAPE', 'JSON 数组元素需为对象。');
    }
  } else if (obj && typeof obj === 'object') {
    const field = objectArrayField(obj);
    if (!field) throw err('JSON_SHAPE', 'JSON 需为对象数组，或包含对象数组字段的对象。');
    arr = field.value;
    if (arr.length === 0) throw err('JSON_SHAPE', 'JSON 数组字段为空，请检查文件。');
    if (!arr.every(function (x) { return x && typeof x === 'object' && !Array.isArray(x); })) {
      throw err('JSON_SHAPE', 'JSON 数组元素需为对象。');
    }
  } else {
    throw err('JSON_SHAPE', 'JSON 需为对象数组，或包含对象数组字段的对象。');
  }
  const keys = [];
  const seen = new Set();
  arr.forEach(function (item) {
    Object.keys(item).forEach(function (k) {
      if (!seen.has(k)) { seen.add(k); keys.push(k); }
    });
  });
  const header = keys.slice();
  const rows = [header];
  arr.forEach(function (item) {
    const row = keys.map(function (k) {
      const v = item[k];
      return v === null || v === undefined ? '' : v;
    });
    rows.push(row);
  });
  return rows;
}

function buildTable(rawRows, meta) {
  const headerRow = (rawRows[0] || []).map(function (v) { return String(v === null || v === undefined ? '' : v); });
  const headerLen = headerRow.length;
  const dataRows = [];
  let extraCols = 0;
  for (let i = 1; i < rawRows.length; i++) {
    const row = rawRows[i] || [];
    const cells = row.map(function (v) { return v === null || v === undefined ? '' : v; });
    if (isBlankRow(cells)) continue;
    const out = cells.slice(0, headerLen);
    if (cells.length > headerLen) extraCols += cells.length - headerLen;
    while (out.length < headerLen) out.push('');
    dataRows.push(out);
  }
  const m = Object.assign({}, meta, {
    totalRows: dataRows.length,
    extraCols: extraCols,
    headerRaw: headerRow
  });
  return { headerRow: headerRow, dataRows: dataRows, meta: m };
}

/* ============================ 字段匹配 ============================ */
const FIELD_SPEC = [
  { key: 'block', label: '区块', required: true },
  { key: 'category', label: '分类', required: true },
  { key: 'share', label: '占比', required: true },
  { key: 'tgi', label: 'TGI', required: true },
  { key: 'parent', label: '父类', required: false },
  { key: 'keyword', label: '关键词', required: false }
];

function matchFields(headerRow) {
  const normHeaders = headerRow.map(function (h) { return normHeaderCell(h); });
  const mapping = {};
  const matched = [];
  const missing = [];
  const duplicates = [];
  const emptyHeaderCols = normHeaders.filter(function (h) { return h === ''; }).length;

  FIELD_SPEC.forEach(function (spec) {
    const target = normHeaderCell(spec.label);
    const cols = [];
    normHeaders.forEach(function (h, i) { if (h === target) cols.push(i); });
    if (cols.length === 0) {
      if (spec.required) missing.push(spec.label);
      return;
    }
    const col = cols[0];
    mapping[spec.key] = col;
    matched.push({ label: spec.label, col: col, text: headerRow[col] });
    if (cols.length > 1) {
      duplicates.push('字段名重复，已取第一列：' + headerRow[col] + '（列 ' + (col + 1) + '）');
    }
  });

  return {
    mapping: mapping,
    matched: matched,
    missing: missing,
    duplicates: duplicates,
    emptyHeaderCols: emptyHeaderCols,
    hasKeywordField: Object.prototype.hasOwnProperty.call(mapping, 'keyword')
  };
}

/* ============================ 数据清洗（步骤 1–9） ============================ */
function cleanData(table, fieldMatch) {
  const mapping = fieldMatch.mapping;
  const hasKeywordField = fieldMatch.hasKeywordField;
  const sourceName = (table.meta && (table.meta.fileName || table.meta.source)) || '';
  // 原生注入时 sourceName 已是最终页名（与状态栏同源），直接沿用，避免规则截断造成「四处不一致」；
  // 只有手动上传的文件才需要从文件名推导关键词。
  const derivedKeyword = hasKeywordField ? '' : (table.meta && table.meta.nativeName
    ? sourceName.trim()
    : deriveKeywordFromName(sourceName));
  const stats = {
    emptyCategory: 0,
    shareMissing: 0,
    shareInvalid: 0,
    shareConverted: 0,
    tgiMissing: 0,
    tgiNegative: 0,
    tgiPct: 0,
    nonStandardBlock: 0,
    zeroValue: 0,
    tgiZeroMark: 0,
    duplicate: 0,
    parentDup: 0,
    extraCols: table.meta.extraCols || 0,
    dateWarnings: 0,
    keywordNullRatio: 0
  };
  const anomalies = {
    emptyCategory: [],
    shareMissing: [],
    shareInvalid: [],
    shareConverted: [],
    tgiMissing: [],
    tgiNegative: [],
    tgiPct: [],
    nonStandardBlock: [],
    zeroValue: [],
    tgiZeroMark: [],
    duplicate: [],
    parentDup: [],
    extraCols: [],
    dateWarnings: [],
    keywordNullRatio: []
  };
  const samples = { shareConverted: [], tgiPct: [] };
  const ctx = { dateWarnings: 0 };
  let unlabeledCount = 0;

  /* 异常明细仅用于页面展示（每段最多 LIST_TRUNCATE 条），计数以 stats 为准；
     限制存储条数，避免大文件下按行累积字符串造成内存膨胀 */
  function note(bucket, text) {
    if (bucket.length < LIST_TRUNCATE) bucket.push(text);
  }

  const records = table.dataRows.map(function (cells, idx) {
    const block = normCell(cellToText(cells[mapping.block], ctx));
    const category = normCell(cellToText(cells[mapping.category], ctx));
    /* 父类列（可选）：抓取端已知下钻时的父标签，用它替代「分类名里是否带下划线」的判断。
       旧文件没有该列时留空，后续统一走下划线兜底。 */
    const parent = (mapping.parent !== undefined)
      ? normCell(cellToText(cells[mapping.parent], ctx))
      : '';
    let keyword = hasKeywordField ? normCell(cellToText(cells[mapping.keyword], ctx)) : (derivedKeyword || SINGLE_KW);
    return {
      _rowIndex: idx + 1,
      block: block,
      category: category,
      parent: parent,
      keyword: keyword,
      shareRaw: cells[mapping.share],
      tgiRaw: cells[mapping.tgi],
      share: null,
      tgi: null,
      _tgiAbnormal: false,
      _parentDup: false
    };
  });

  /* 步骤 1：字段与值规范化（含关键词归一） */
  records.forEach(function (r) {
    if (hasKeywordField && r.keyword === '') {
      r.keyword = UNLABELED_KW;
      unlabeledCount += 1;
    }
  });

  const seenBlocks = new Set();
  records.forEach(function (r) { seenBlocks.add(r.block); });
  const blocksPresent = STANDARD_BLOCKS.filter(function (b) { return seenBlocks.has(b); });
  const blocksMissing = STANDARD_BLOCKS.filter(function (b) { return !seenBlocks.has(b); });

  let working = records.slice();

  /* 步骤 2：行级空值检查 */
  working = working.filter(function (r) {
    if (r.block === '' || r.category === '') {
      stats.emptyCategory += 1;
      note(anomalies.emptyCategory, '第 ' + r._rowIndex + ' 行：区块=' + (r.block || '(空)') + '，分类=' + (r.category || '(空)'));
      return false;
    }
    return true;
  });

  /* 步骤 3：占比解析 */
  const afterShare = [];
  working.forEach(function (r) {
    const p = parseNumericString(r.shareRaw);
    if (!p.ok) {
      stats.shareMissing += 1;
      note(anomalies.shareMissing, '第 ' + r._rowIndex + ' 行：区块=' + r.block + '，分类=' + r.category + '，占比原值=' + String(p.raw));
      return;
    }
    if (p.hadPct) {
      const v = p.value / 100;
      if (v < 0 || v > 1) {
        stats.shareInvalid += 1;
        note(anomalies.shareInvalid, '第 ' + r._rowIndex + ' 行：区块=' + r.block + '，分类=' + r.category + '，占比原值=' + String(p.raw));
        return;
      }
      r.share = v;
      afterShare.push(r);
      return;
    }
    const v = p.value;
    if (v < 0) {
      stats.shareInvalid += 1;
      note(anomalies.shareInvalid, '第 ' + r._rowIndex + ' 行：区块=' + r.block + '，分类=' + r.category + '，占比原值=' + String(p.raw));
      return;
    }
    if (v <= 1) {
      r.share = v;
      afterShare.push(r);
      return;
    }
    if (v <= 100) {
      r.share = v / 100;
      stats.shareConverted += 1;
      note(anomalies.shareConverted, '第 ' + r._rowIndex + ' 行：区块=' + r.block + '，分类=' + r.category + '，文件原值占比=' + String(p.raw));
      if (samples.shareConverted.length < ANOMALY_SAMPLE_MAX) samples.shareConverted.push(String(p.raw));
      afterShare.push(r);
      return;
    }
    stats.shareInvalid += 1;
    note(anomalies.shareInvalid, '第 ' + r._rowIndex + ' 行：区块=' + r.block + '，分类=' + r.category + '，占比原值=' + String(p.raw));
  });

  /* 步骤 4：TGI 解析 */
  const afterTgi = [];
  afterShare.forEach(function (r) {
    const p = parseNumericString(r.tgiRaw);
    if (!p.ok) {
      stats.tgiMissing += 1;
      note(anomalies.tgiMissing, '第 ' + r._rowIndex + ' 行：区块=' + r.block + '，分类=' + r.category + '，TGI原值=' + String(p.raw));
      return;
    }
    if (p.hadPct) {
      stats.tgiPct += 1;
      note(anomalies.tgiPct, '第 ' + r._rowIndex + ' 行：区块=' + r.block + '，分类=' + r.category + '，TGI原值=' + String(p.raw));
      if (samples.tgiPct.length < ANOMALY_SAMPLE_MAX) samples.tgiPct.push(String(p.raw));
    }
    if (p.value < 0) {
      stats.tgiNegative += 1;
      note(anomalies.tgiNegative, '第 ' + r._rowIndex + ' 行：区块=' + r.block + '，分类=' + r.category + '，TGI原值=' + String(p.raw));
      return;
    }
    r.tgi = p.value;
    afterTgi.push(r);
  });

  /* 步骤 5：区块标准性判定 */
  const afterBlock = [];
  afterTgi.forEach(function (r) {
    if (STANDARD_BLOCKS.indexOf(r.block) === -1) {
      stats.nonStandardBlock += 1;
      if (anomalies.nonStandardBlock.indexOf(r.block) === -1) {
        note(anomalies.nonStandardBlock, r.block);
      }
      return;
    }
    afterBlock.push(r);
  });

  /* 步骤 6：零值剔除 */
  const afterZero = [];
  afterBlock.forEach(function (r) {
    if (r.share === 0 && r.tgi === 0) {
      stats.zeroValue += 1;
      note(anomalies.zeroValue, '第 ' + r._rowIndex + ' 行：区块=' + r.block + '，分类=' + r.category + '（占比 0、TGI 0）');
      return;
    }
    afterZero.push(r);
  });

  /* 步骤 7：TGI 异常标记（零值标记，保留） */
  afterZero.forEach(function (r) {
    if (r.tgi === 0 && r.share > 0) {
      r._tgiAbnormal = true;
      stats.tgiZeroMark += 1;
      note(anomalies.tgiZeroMark, '第 ' + r._rowIndex + ' 行：区块=' + r.block + '，分类=' + r.category + '（占比>0、TGI=0）');
    }
  });

  /* 步骤 8：重复检测 */
  const dropped = new Set();
  const generalFirst = new Map();
  afterZero.forEach(function (r) {
    const isParent = r.block === CONTENT_BLOCK && !isSecondaryRow(r);
    if (isParent) return;
    /* 异常行（占比 >0 但 TGI=0）会被后面的步骤排除出榜单，不能让它抢先占住重复键，
       否则会挤掉同组里本该保留的正常行。 */
    if (r._tgiAbnormal) return;
    const key = r.keyword + SEP + r.block + SEP + r.category;
    if (generalFirst.has(key)) {
      stats.duplicate += 1;
      note(anomalies.duplicate, '第 ' + r._rowIndex + ' 行：区块=' + r.block + '，分类=' + r.category);
      dropped.add(r);
    } else {
      generalFirst.set(key, r);
    }
  });

  const parentGroups = new Map();
  afterZero.forEach(function (r) {
    if (!(r.block === CONTENT_BLOCK && !isSecondaryRow(r))) return;
    const key = r.keyword + SEP + r.block + SEP + r.category;
    if (!parentGroups.has(key)) parentGroups.set(key, []);
    parentGroups.get(key).push(r);
  });
  parentGroups.forEach(function (group) {
    if (group.length > 1) {
      group.forEach(function (r) { r._parentDup = true; });
      stats.parentDup += group.length;
      const name = group[0].category;
      if (anomalies.parentDup.indexOf(name) === -1) {
        note(anomalies.parentDup, name);
      }
    }
  });

  /* 步骤 9：清洗保留记录 */
  const kept = afterZero.filter(function (r) { return !dropped.has(r); });

  /* 分组索引：按 关键词 + SEP + 区块 一次性分组，渲染/计算阶段不再反复 filter 全量数据 */
  const grouped = new Map();
  const countByKeyword = new Map();
  let hasUnderscore = false;
  kept.forEach(function (r) {
    const key = r.keyword + SEP + r.block;
    let arr = grouped.get(key);
    if (!arr) {
      arr = [];
      grouped.set(key, arr);
    }
    arr.push(r);
    countByKeyword.set(r.keyword, (countByKeyword.get(r.keyword) || 0) + 1);
    if (!hasUnderscore && r.block === CONTENT_BLOCK && r.category.indexOf('_') !== -1) {
      hasUnderscore = true;
    }
  });
  /* 父类索引与父类重复集合一次性构建，供各关键词复用 */
  const parentInfo = buildParentIndex(kept);

  /* 软提示：关键词空值比例过高 */
  if (hasKeywordField && records.length > 0) {
    const ratio = unlabeledCount / records.length;
    if (ratio > KEYWORD_NULL_RATIO_ALERT) {
      stats.keywordNullRatio = 1;
      anomalies.keywordNullRatio.push('未标注关键词记录 ' + unlabeledCount + ' / 全部 ' + records.length + '（' + fmt(ratio * 100, 1) + '%）');
    }
  }

  stats.dateWarnings = ctx.dateWarnings;
  if (stats.extraCols > 0) {
    anomalies.extraCols.push('数据行存在超出表头的多余单元格 ' + stats.extraCols + ' 个，已忽略');
  }
  if (ctx.dateWarnings > 0) {
    anomalies.dateWarnings.push('检测到 ' + ctx.dateWarnings + ' 个日期单元格，已格式化为 YYYY-MM-DD');
  }

  return {
    kept: kept,
    grouped: grouped,
    countByKeyword: countByKeyword,
    parentInfo: parentInfo,
    hasUnderscore: hasUnderscore,
    stats: stats,
    anomalies: anomalies,
    samples: samples,
    blocksPresent: blocksPresent,
    blocksMissing: blocksMissing,
    totalRecords: records.length,
    unlabeledCount: unlabeledCount,
    hasKeywordField: hasKeywordField,
    derivedKeyword: derivedKeyword,
    extraCols: table.meta.extraCols || 0,
    meta: table.meta,
    fieldMatch: fieldMatch
  };
}
/* ============================ 父类索引与 R 计算 ============================ */
function buildParentIndex(kept) {
  const index = new Map();
  const dupSet = new Set();
  kept.forEach(function (r) {
    if (r.block !== CONTENT_BLOCK) return;
    const key = r.keyword + SEP + r.category;
    if (r._parentDup) {
      dupSet.add(key);
      return;
    }
    if (!isSecondaryRow(r) && r.category !== '') {
      index.set(key, r.share);
    }
  });
  return { index: index, dupSet: dupSet };
}

/* 是否为二级类目：优先用抓取端给的「父类」列；旧文件没有该列时，
   退回「分类名里带下划线」的老判定。 */
function isSecondaryRow(r) {
  if (r.parent) return true;
  return r.category.indexOf('_') !== -1;
}

/* R = 二级占比 ÷ 父类占比 × 100，仅表示「相对父类的大小」，不参与综合分与排名。
   实测存在 R>100（子类占比高于父类总量），说明一级/二级不是严格的加和拆分关系，
   因此这里只做中性判定，不用「超常发挥」这类带褒贬的说法。 */
function computeR(record, parentInfo) {
  const parentName = record.parent || record.category.split('_')[0];
  const key = record.keyword + SEP + parentName;
  if (parentInfo.dupSet.has(key)) return { status: '父类重复', value: null };
  if (!parentInfo.index.has(key)) return { status: '父类缺失', value: null };
  const parentShare = parentInfo.index.get(key);
  if (parentShare === 0) return { status: '父类占比为 0', value: null };
  const R = record.share / parentShare * 100;
  return { status: R > 100 ? '高于父类' : '未超父类', value: R, parentName: parentName, parentShare: parentShare };
}

/* ============================ 榜单计算 ============================ */
function interpretationOf(row, isMixed) {
  if (!row.qCode) return '—';
  if (isMixed && row.Rstatus === '高于父类' && isFiniteNumber(row.R)) {
    return '该二级占比高于父类总量（R=' + fmt(row.R, 1) + '%），说明一/二级并非严格加和拆分，以占比本体为准。';
  }
  switch (row.qCode) {
    case 'HH':
      return row.tgi > 100 ? '规模与偏好双高，属重点机会。' : '规模高但偏好未超大盘，属规模机会，需优化内容匹配。';
    case 'HL':
      return '规模/强度突出但偏好低于大盘，需提升内容匹配。';
    case 'LH':
      return '偏好高于大盘但规模/强度有限，适合精准渗透。';
    case 'LL':
      return row.tgi > 100 ? '偏好高于大盘但综合表现一般，可小范围测试。' : '综合表现一般，优先级较低。';
    default:
      return '—';
  }
}

function buildList(records, opts) {
  const isMixed = !!opts.isMixed;
  const rows = records.map(function (r) {
    const copy = {
      name: r.category,
      block: r.block,
      keyword: r.keyword,
      share: r.share,
      tgi: r.tgi,
      _rowIndex: r._rowIndex,
      R: isFiniteNumber(r.R) ? r.R : null,
      Rstatus: r.Rstatus || '',
      parentName: r.parentName || '',
      parentShare: isFiniteNumber(r.parentShare) ? r.parentShare : null,
      seq: r.seq || 0,
      S: null,
      P: null,
      composite: null,
      rank: null,
      qCode: '',
      qText: '样本不足',
      interp: '—'
    };
    return copy;
  });
  const n = rows.length;
  let medS = NaN;
  let medP = NaN;
  if (n >= 2) {
    /* 口径 v2 见 assets/scoring.js：对数域稳健标准化 + 几何合成 + 权重敏感性名次区间 */
    const scored = DyScoring.scoreRows(rows);
    rows.forEach(function (r, i) {
      r.S = scored.S[i];
      r.P = scored.P[i];
      r.composite = scored.composite[i];
      r.rank = scored.rank[i];
      r.rankLo = scored.rankLo[i];
      r.rankHi = scored.rankHi[i];
    });
    const sorted = rows.slice().sort(function (a, b) { return a.rank - b.rank; });
    /* 稳健分是原值的单调映射，中位数恒映射为 50，故象限阈值仍是 50。 */
    medS = 50;
    medP = 50;
    /* 某维无差异（IQR=0，全为 50）时无法区分高低，不应把全榜判成“高”象限 */
    const sFlat = scored.flatS;
    const pFlat = scored.flatP;
    rows.forEach(function (r) {
      if (sFlat || pFlat) {
        r.qCode = '';
        r.qText = '该维无差异，不判定四象限';
        r.interp = '—';
        return;
      }
      const highS = r.S >= medS;
      const highP = r.P >= medP;
      r.qCode = (highS ? 'H' : 'L') + (highP ? 'H' : 'L');
      r.qText = QUADRANT_TEXT[r.qCode];
      r.interp = interpretationOf(r, isMixed);
    });
    return {
      id: opts.id,
      name: opts.name,
      n: n,
      rows: sorted,
      medS: medS,
      medP: medP,
      smallSample: n < 4,
      hasRank: true,
      isMixed: isMixed
    };
  }
  rows.sort(function (a, b) {
    const c = collator().compare(a.name, b.name);
    return c || a._rowIndex - b._rowIndex;
  });
  return {
    id: opts.id,
    name: opts.name,
    n: n,
    rows: rows,
    medS: NaN,
    medP: NaN,
    smallSample: false,
    hasRank: false,
    isMixed: isMixed
  };
}

function buildKeywordResult(keyword) {
  const clean = state.clean;
  /* 复用 cleanData 一次性构建的分组索引与父类索引，避免对全量 kept 反复 filter */
  const grouped = clean.grouped;
  const parentInfo = clean.parentInfo;
  const blockLists = [];
  let mixedList = null;
  const unavailable = { dup: [], missing: [], zero: [], dupTotal: 0, missingTotal: 0, zeroTotal: 0 };

  function rowsOf(block) {
    return grouped.get(keyword + SEP + block) || [];
  }

  STANDARD_BLOCKS.forEach(function (block) {
    const rows = rowsOf(block);
    if (block === CONTENT_BLOCK) {
      blockLists.push(buildList(rows.filter(function (r) {
        return !isSecondaryRow(r) && !r._parentDup && !r._tgiAbnormal;
      }), { id: 'block:' + block, name: block }));
      return;
    }
    const usable = rows.filter(function (r) { return !r._tgiAbnormal; });
    if (block === '手机价格分布') {
      const seen = new Set();
      let seq = 0;
      const tagged = [];
      usable.slice().sort(function (a, b) { return a._rowIndex - b._rowIndex; }).forEach(function (r) {
        if (seen.has(r.category)) return;
        seen.add(r.category);
        seq += 1;
        /* 复制一份再打档位序号，避免把 seq 写回 clean.kept 中的原始记录 */
        tagged.push(Object.assign({}, r, { seq: seq }));
      });
      blockLists.push(buildList(tagged, { id: 'block:' + block, name: block }));
      return;
    }
    blockLists.push(buildList(usable, { id: 'block:' + block, name: block }));
  });

  const secondaryRows = [];
  rowsOf(CONTENT_BLOCK).forEach(function (r) {
    if (!isSecondaryRow(r)) return;
    if (r._tgiAbnormal) return;
    const rInfo = computeR(r, parentInfo);
    if (rInfo.value === null) {
      /* R 只是说明列，不参与综合分与排名：这类行同样要进混合榜，
         否则榜单样本量会随「页面是否展示父类行」而缩水。异常明细照旧记录，供诊断参考。 */
      const item = '第 ' + r._rowIndex + ' 行：' + r.category + '（父类 ' + (rInfo.parentName || r.parent || '(空)') + '）';
      const kind = rInfo.status === '父类重复' ? 'dup' : (rInfo.status === '父类缺失' ? 'missing' : 'zero');
      unavailable[kind + 'Total'] += 1;
      /* 明细只保留前 LIST_TRUNCATE 条，计数单独累加，避免大文件下内存膨胀 */
      if (unavailable[kind].length < LIST_TRUNCATE) unavailable[kind].push(item);
    }
    secondaryRows.push({
      category: r.category,
      block: r.block,
      keyword: r.keyword,
      share: r.share,
      tgi: r.tgi,
      _rowIndex: r._rowIndex,
      R: rInfo.value,
      Rstatus: rInfo.status,
      parentName: rInfo.parentName || r.parent || r.category.split('_')[0],
      parentShare: rInfo.parentShare
    });
  });

  mixedList = buildList(secondaryRows, { id: 'mixed', name: '二级混合总榜', isMixed: true });

  const superCount = mixedList.rows.filter(function (r) { return r.Rstatus === '高于父类'; }).length;

  return {
    keyword: keyword,
    keptCount: clean.countByKeyword.get(keyword) || 0,
    blockLists: blockLists,
    mixed: mixedList,
    unavailable: unavailable,
    superCount: superCount,
    hasMixed: mixedList.n >= 1
  };
}

function listById(result, id) {
  if (id === 'mixed') return result.mixed;
  for (let i = 0; i < result.blockLists.length; i++) {
    if (result.blockLists[i].id === id) return result.blockLists[i];
  }
  return null;
}

/* 解析/分析失败时清掉骨架屏与加载条，避免页面停在加载态 */
function clearLoadingArea() {
  const results = el('results');
  const bar = el('loadingBar');
  if (bar) bar.remove();

    results.innerHTML = '<div class="empty-state" id="emptyState">处理失败，请重试</div>';
  }

  }
}

function setStatus(status) {
  state.status = status;

}

function currentResult() {
  return state.resultCache.get(state.currentKeyword) || null;
}

function hasValidRecords() {
  const r = currentResult();
  if (!r) return false;
  let n = r.mixed.n;
  r.blockLists.forEach(function (l) { n += l.n; });
  return n > 0;
}

function syncUI() {
  const status = state.status;
  const busy = status === 'parsing' || status === 'analyzing';
  const idle = status === 'idle';
  const success = status === 'success';

  el('sampleBtn').disabled = busy;
  el('reanalyzeBtn').disabled = busy || idle || !state.clean;
  el('exportBtn').disabled = busy || !success || !hasValidRecords();
  el('clearBtn').disabled = busy || (!state.file && !state.clean);
  el('kwSelect').disabled = busy && status === 'parsing';
}

/* ============================ 排序与表格 ============================ */
function getSort(list) {
  const key = state.currentKeyword + SEP + list.id;
  if (!state.sortState.has(key)) state.sortState.set(key, { key: 'rank', dir: 'asc' });
  return state.sortState.get(key);
}

function sortValue(row, key) {
  switch (key) {
    case 'share': return row.share;
    case 'tgi': return row.tgi;
    case 'S': return row.S;
    case 'P': return row.P;
    case 'composite': return row.composite;
    case 'rank': return row.rank;
    case 'rankLo': return isFiniteNumber(row.rankLo) ? row.rankLo : row.rank;
    case 'R': return row.R;
    case 'seq': return row.seq;
    default: return null;
  }
}

function displayRows(list) {
  const st = getSort(list);
  const rows = list.rows.slice();
  if (st.key === 'rank') {
    if (st.dir === 'desc') rows.reverse();
    return rows.slice(0, RANK_DISPLAY_LIMIT);
  }
  const dir = st.dir === 'asc' ? 1 : -1;
  rows.sort(function (a, b) {
    const va = sortValue(a, st.key);
    const vb = sortValue(b, st.key);
    const na = isFiniteNumber(va) ? va : -Number.MAX_SAFE_INTEGER;
    const nb = isFiniteNumber(vb) ? vb : -Number.MAX_SAFE_INTEGER;
    if (na !== nb) return (na - nb) * dir;
    const ra = isFiniteNumber(a.rank) ? a.rank : Number.MAX_SAFE_INTEGER;
    const rb = isFiniteNumber(b.rank) ? b.rank : Number.MAX_SAFE_INTEGER;
    if (ra !== rb) return ra - rb;
    return a._rowIndex - b._rowIndex;
  });
  return rows.slice(0, RANK_DISPLAY_LIMIT);
}

function thSort(label, key, list, width, alignRight, sortable) {
  const style = 'min-width:' + width + 'px;' + (alignRight ? 'text-align:right;' : '');
  if (!sortable) {
    return '<th scope="col" style="' + style + '">' + esc(label) + '</th>';
  }
  const st = getSort(list);
  const active = st.key === key;
  const arrow = active ? (st.dir === 'asc' ? '▲' : '▼') : '';
  const aria = active ? (st.dir === 'asc' ? 'ascending' : 'descending') : 'none';
  return '<th scope="col" role="columnheader" tabindex="0" class="sortable" aria-sort="' + aria +
    '" data-sort="' + key + '" style="' + style + '">' + esc(label) +
    '<span class="arrow">' + arrow + '</span></th>';
}

/* 占比展示/导出：最多 2 位小数并去掉尾随 0，避免 0.01% 被舍成 0.0% */
function formatShare(v) {
  if (!isFiniteNumber(v)) return '—';
  let s = (v * 100).toFixed(2);
  if (s.indexOf('.') !== -1) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s + '%';
}

/* 数值展示/导出：最多 2 位小数并去掉尾随 0，保留 86.88 这类原始精度 */
function numText(v) {
  if (!isFiniteNumber(v)) return '—';
  let s = v.toFixed(2);
  if (s.indexOf('.') !== -1) s = s.replace(/0+$/, '').replace(/\.$/, '');
  return s;
}

function quadrantCell(row, list) {
  if (!row.qCode) {
    return '<span class="placeholder">' + esc(row.qText || '样本不足') + '</span>';
  }
  let html = '<span class="tag ' + QUADRANT_CLASS[row.qCode] + '">' + esc(row.qText) + '</span>';
  if (row.tgi > 100) html += '<span class="tag tgi-tag">偏好高于大盘</span>';
  if (list.smallSample) html += '<span class="tag-note">样本较少，仅参考</span>';
  return html;
}

function bindSortHandlers() {
  state.tableRegistry.forEach(function (meta, domId) {
    const table = el(domId);
    if (!table) return;
    table.querySelectorAll('th.sortable').forEach(function (th) {
      const key = th.getAttribute('data-sort');
      if (key === 'quad' || key === 'interp' || key === 'parent' || key === 'Rstatus') return;
      function doSort() {
        const list = listById(currentResult(), meta.listId);
        if (!list) return;
        const st = getSort(list);
        if (st.key === key) st.dir = st.dir === 'asc' ? 'desc' : 'asc';
        else { st.key = key; st.dir = 'asc'; }
        refreshTable(domId, meta.listId);
      }
      th.addEventListener('click', doSort);
      th.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doSort(); }
      });
    });
  });
}

function refreshTable(domId, listId) {
  const list = listById(currentResult(), listId);
  const table = el(domId);
  if (!list || !table) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = tableHTML(list, listId);
  const fresh = tmp.querySelector('table');
  table.replaceWith(fresh);
  const meta = state.tableRegistry.get(domId) || { listId: listId };
  state.tableRegistry.set(domId, meta);
  bindSortHandlersOne(domId);
}

function bindSortHandlersOne(domId) {
  const table = el(domId);
  if (!table) return;
  const meta = state.tableRegistry.get(domId);
  if (!meta) return;
  table.querySelectorAll('th.sortable').forEach(function (th) {
    const key = th.getAttribute('data-sort');
    if (key === 'quad' || key === 'interp' || key === 'parent' || key === 'Rstatus') return;
    function doSort() {
      const list = listById(currentResult(), meta.listId);
      if (!list) return;
      const st = getSort(list);
      if (st.key === key) st.dir = st.dir === 'asc' ? 'desc' : 'asc';
      else { st.key = key; st.dir = 'asc'; }
      refreshTable(domId, meta.listId);
    }
    th.addEventListener('click', doSort);
    th.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doSort(); }
    });
  });
}

  return '<section class="card" id="card-mixed">' +
    '<div class="card-head"><h2>二级混合总榜</h2><span class="meta">榜单有效记录 ' + list.n + ' 条' +
    (list.n > RANK_DISPLAY_LIMIT ? '，展示 Top' + RANK_DISPLAY_LIMIT : '，展示全部 ' + list.n + ' 条') + '</span></div>' +
    '<div class="hint-bar">综合得分 = 规模分与偏好分的几何合成（两维先在 log 空间做稳健标准化，中位数记 50 分、中间区段 1 IQR 约合 ±25 分，映射到 0–100 而不做硬截断）；名次区间表示权重在 0.3–0.7 间变化时的最好/最差名次。R（相对父类占比）与 R 判定仅作参考，不参与打分。</div>' +
    tableHTML(list, list.id) +
    '</section>';
}

function renderResults() {
  if (slowTimer) {
    clearTimeout(slowTimer);
    slowTimer = null;
  }
  state.domIdMap = new Map();
  state.tableRegistry = new Map();
  const result = currentResult();
  const nav = el('resultNav');
  const results = el('results');
  const controlTips = el('controlTips');
  if (!result) {
    teardownNav();
    results.innerHTML = '<div class="empty-state" id="emptyState">暂无数据，等待自动载入…</div>';
    nav.hidden = true;
    if (controlTips) { controlTips.innerHTML = ''; controlTips.hidden = true; }
    return;
  }
  let idx = 0;
  result.blockLists.forEach(function (l) {
    if (state.clean.blocksPresent.indexOf(l.name) === -1) return;
    state.domIdMap.set(l.id, 'tbl-' + idx++);
  });
  if (result.hasMixed) state.domIdMap.set(result.mixed.id, 'tbl-' + idx++);

  results.innerHTML = blockCardsHTML(result) + mixedHTML(result);

  if (controlTips) {
    controlTips.innerHTML = tipsHTML(result);
    controlTips.hidden = state.collapsed;
  }

  state.domIdMap.forEach(function (domId, listId) {
    state.tableRegistry.set(domId, { listId: listId });
  });
  bindSortHandlers();
  setupNav(result);
  refreshSticky();
}

/* ============================ 导航与吸顶偏移 ============================ */
function stickyOffset() {
  return state._stickyOffsetCache || 0;
}

function refreshSticky() {
  const topbar = document.querySelector('.topbar');
  const control = el('control');
  const nav = el('resultNav');
  const topH = topbar ? topbar.offsetHeight : 48;
  const controlH = control ? control.offsetHeight : 0;
  const navH = nav ? nav.offsetHeight : 54;
  // --sticky-h 只给 nav/error-bar 的 top 用（含 topbar+control，不含 nav 自身），避免循环依赖
  document.documentElement.style.setProperty('--sticky-h', (topH + controlH) + 'px');
  document.documentElement.style.setProperty('--nav-h', navH + 'px');
  state._stickyOffsetCache = topH + controlH + navH;
}

function teardownNav() {
  if (state.activeNavObserver) {
    state.activeNavObserver.disconnect();
    state.activeNavObserver = null;
  }
}

function setupNav(result, refreshOnly) {
  const nav = el('resultNav');
  if (!refreshOnly) {
    // 动态生成 nav items（提示已并入控制台，不再单独占位）
    let html = '';
    result.blockLists.forEach(function (list) {
      if (state.clean.blocksPresent.indexOf(list.name) === -1) return;
      const id = safeAnchor(list.name);
      html += '<a href="#' + id + '" data-target="' + id + '">' + esc(list.name) + '</a>';
    });
    if (result.hasMixed) html += '<a href="#card-mixed" data-target="card-mixed">二级混合总榜</a>';
    nav.innerHTML = html;
    nav.hidden = false;
  }

  // 建立 IntersectionObserver 同步高亮
  const targets = [];
  nav.querySelectorAll('a').forEach(function (a) {
    const id = a.getAttribute('data-target');
    const node = document.getElementById(id);
    if (node) targets.push(node);
  });
  teardownNav();
  const offset = stickyOffset() + 8;
  state.activeNavObserver = new IntersectionObserver(function (entries) {
    let best = null;
    entries.forEach(function (entry) {
      if (!entry.isIntersecting) return;
      if (!best || entry.intersectionRatio > best.intersectionRatio) best = entry;
    });
    if (best) setActiveNav(best.target.id);
  }, { rootMargin: '-' + offset + 'px 0px -55% 0px', threshold: [0, 0.05, 0.2, 0.5, 1] });
  targets.forEach(function (t) { state.activeNavObserver.observe(t); });
  const first = targets[0];
  if (first) setActiveNav(first.id);
}

function setActiveNav(id) {
  el('resultNav').querySelectorAll('a').forEach(function (a) {
    a.classList.toggle('active', a.getAttribute('data-target') === id);
  });
}

/* ============================ 加载态 ============================ */
let slowTimer = null;
function showLoading(keepPrevious) {
  const results = el('results');
  const nav = el('resultNav');
  if (keepPrevious && state.clean) {
    if (!el('loadingBar')) {
      results.insertAdjacentHTML('afterbegin',
        '<div class="card" id="loadingBar"><div class="loading" aria-busy="true"><span class="spinner"></span>' +
        '<span id="loadingText">正在分析…</span></div><div class="progress-track"><div class="progress-bar" style="width:35%"></div></div></div>');
    }
  } else {
    /* 骨架屏会替换整个结果区，旧导航目标已失效，先解绑 observer 防止泄漏 */
    teardownNav();
    nav.hidden = true;
    results.innerHTML = '<div class="card skeleton" aria-busy="true"><div class="loading"><span class="spinner"></span>' +
      '<span id="loadingText">正在解析…</span></div><div class="progress-track"><div class="progress-bar"></div></div>' +
      '<div class="sk-line" style="width:60%"></div><div class="sk-line" style="width:90%"></div>' +
      '<div class="sk-line" style="width:80%"></div><div class="sk-line" style="width:70%"></div></div>';
  }
  if (slowTimer) clearTimeout(slowTimer);
  slowTimer = setTimeout(function () {
    const t = el('loadingText');
    if (t) t.textContent = '处理中，请稍候…';
  }, 5000);
}
/* ============================ 主流程 ============================ */
// CSV 解析使用内联解析器，不依赖 CDN；Excel 解析依赖 XLSX（未内置时会给出明确提示）。
const CDN_OK = typeof XLSX !== 'undefined';

function keywordOptionLabel(kw) {
  return kw === UNLABELED_KW ? '（未标注，建议核查源数据）' : kw;
}

function setupKeywordUI() {
  const row = el('kwRow');
  const sel = el('kwSelect');
  if (!state.hasKeywordField) {
    row.hidden = true;
    sel.innerHTML = '';
    return;
  }
  row.hidden = false;
  sel.innerHTML = state.keywords.map(function (k) {
    return '<option value="' + esc(k) + '">' + esc(keywordOptionLabel(k)) + '</option>';
  }).join('');
  const normal = state.keywords.filter(function (k) { return k !== UNLABELED_KW; }).length;
  let text = '共 ' + normal + ' 个关键词';
  if (state.keywords.indexOf(UNLABELED_KW) !== -1) text += '，另有未标注关键词';
  el('kwCount').textContent = text;
}

function scrollToResultsTop() {
  const results = el('results');
  const top = results.getBoundingClientRect().top + window.scrollY - stickyOffset() - 8;
  window.scrollTo({ top: Math.max(0, top), behavior: 'auto' });
}

function analyzeKeyword(kw, opts) {
  opts = opts || {};
  state.currentKeyword = kw;
  if (state.hasKeywordField) el('kwSelect').value = kw;
  const cached = state.resultCache.get(kw);
  if (cached) {
    setStatus('success');
    renderResults();
    if (opts.resetScroll) scrollToResultsTop();
    return;
  }
  const keepPrevious = !!document.querySelector('#results .card');
  setStatus('analyzing');
  showLoading(keepPrevious);
  const token = state.generation;
  setTimeout(function () {
    if (token !== state.generation || state.currentKeyword !== kw) return;
    const result = buildKeywordResult(kw);
    state.resultCache.set(kw, result);
    setStatus('success');
    renderResults();
    if (opts.resetScroll) scrollToResultsTop();
  }, 0);
}

function processTable(table) {
  if (!table.headerRow || table.headerRow.length === 0 ||
      table.headerRow.every(function (h) { return blankText(h); })) {
    showError('未检测到有效表头，请检查文件第一行是否为字段名。');
    setStatus('error');
    return;
  }
  if (table.dataRows.length === 0) {
    showError('文件无数据行，请检查文件内容。');
    setStatus('error');
    return;
  }
  const fm = matchFields(table.headerRow);
  if (fm.missing.length) {
    showError('缺少必需字段：' + fm.missing.join('、') + '。请检查表头命名后重试。');
    setStatus('error');
    return;
  }
  const clean = cleanData(table, fm);
  const kws = Array.from(clean.countByKeyword.keys());
  if (kws.length === 0) {
    /* 先不写入 state.clean：否则关闭错误条时会被误判为“已完成” */
    showError('清洗后无有效记录，请检查数据内容。');
    setStatus('error');
    return;
  }
  state.clean = clean;
  state.hasKeywordField = fm.hasKeywordField;
  const ordered = kws.filter(function (k) { return k !== UNLABELED_KW; })
    .sort(function (a, b) { return collator().compare(a, b); });
  if (kws.indexOf(UNLABELED_KW) !== -1) ordered.push(UNLABELED_KW);
  state.keywords = ordered;
  state.resultCache = new Map();
  state.sortState = new Map();
  setupKeywordUI();
  analyzeKeyword(ordered[0], { resetScroll: true });
}

function resetForNewData() {
  state.clean = null;
  state.hasKeywordField = false;
  state.keywords = [];
  state.currentKeyword = '';
  state.resultCache = new Map();
  state.sortState = new Map();
  /* 清理上一份数据的渲染状态：目录观察器与表格映射，避免持有旧 DOM 引用 */
  teardownNav();
  state.domIdMap = new Map();
  state.tableRegistry = new Map();
  if (slowTimer) {
    clearTimeout(slowTimer);
    slowTimer = null;
  }
  el('kwRow').hidden = true;
  el('kwSelect').innerHTML = '';
  el('kwCount').textContent = '';
}

async function handleFile(file) {
  const name = file && file.name ? file.name : '';
  const ext = name.indexOf('.') !== -1 ? name.split('.').pop().toLowerCase() : '';
  if ((ext === 'xlsx' || ext === 'xls') && !CDN_OK) {
    showToast('Excel 解析依赖未加载，暂不支持 .xlsx/.xls 文件，请改用 .csv 格式。');
    return;
  }
  if (file.size === 0) {
    showError('文件为空（0 字节），请重新选择。');
    setStatus('error');
    return;
  }
  if (['csv', 'xlsx', 'xls', 'json'].indexOf(ext) === -1) {
    showError('不支持的文件格式：' + (ext ? '.' + ext : '(未知)') + '，仅支持 .csv、.xlsx、.xls、.json。');
    setStatus('error');
    return;
  }
  if (file.size > MAX_UPLOAD_MB * 1024 * 1024) {
    showToast('文件较大，解析可能较慢，建议拆分后上传');
  }
  const token = ++state.generation;
  state.file = file;
  resetForNewData();
  clearError();
  setStatus('parsing');
  showLoading(false);

  let table = null;
  try {
    if (ext === 'csv') {
      const buf = await readArrayBuffer(file);
      if (token !== state.generation) return;
      const info = decodeUtf8(buf);
      const enc = checkEncoding(info, 'csv');
      if (enc) throw enc;
      const rows = await parseCsv(info.text);
      if (token !== state.generation) return;
      table = buildTable(rows, { source: 'CSV', fileName: name });
    } else if (ext === 'xlsx' || ext === 'xls') {
      const buf = await readArrayBuffer(file);
      if (token !== state.generation) return;
      const res = await parseExcel(buf);
      if (token !== state.generation) return;
      table = buildTable(res.rows, { source: 'Excel', fileName: name, sheetName: res.sheetName, merges: res.merges });
    } else {
      const buf = await readArrayBuffer(file);
      if (token !== state.generation) return;
      const info = decodeUtf8(buf);
      const enc = checkEncoding(info, 'json');
      if (enc) throw enc;
      let obj;
      try {
        obj = JSON.parse(info.text);
      } catch (e) {
        throw err('JSON_PARSE', 'JSON 解析失败：' + String(e.message || e) + '。');
      }
      const rows = jsonToRows(obj);
      table = buildTable(rows, { source: 'JSON', fileName: name });
    }
  } catch (e) {
    if (e && e.aborted) return;
    if (token !== state.generation) return;
    showError((e && e.message) ? e.message : '解析失败，请检查文件内容。');
    setStatus('error');
    return;
  }
  if (token !== state.generation) return;
  processTable(table);
}

function loadSample() {
  if (state.file && !window.confirm('加载示例数据将覆盖当前文件与结果，是否继续？')) return;
  const token = ++state.generation;
  const sample = makeSampleTable();
  state.file = { name: '内置示例数据', size: 0, sample: true };
  resetForNewData();
  clearError();
  setStatus('parsing');
  showLoading(false);
  setTimeout(function () {
    if (token !== state.generation) return;
    const table = buildTable([sample.headerRow].concat(sample.dataRows), {
      source: sample.meta.source,
      fileName: sample.meta.source
    });
    processTable(table);
  }, 0);
}

function clearAll() {
  state.generation += 1;
  if (state.activeReader) {
    try { state.activeReader.abort(); } catch (e) { /* ignore */ }
    state.activeReader = null;
  }
  state.file = null;
  resetForNewData();
  teardownNav();
  clearError();
  el('results').innerHTML = '<div class="empty-state" id="emptyState">数据已清空，等待新数据…</div>';
  el('resultNav').hidden = true;
  setStatus('idle');
}

/* ============================ 导出（xlsx） ============================ */
/* 导出到 Excel 的数值列：保留位数但保持 number 类型，便于在 Excel 里直接排序 / 求和 */
function numCell(v, digits) {
  if (!isFiniteNumber(v)) return '';
  const p = Math.pow(10, digits);
  return Math.round(v * p) / p;
}

function buildExportRecords(result) {
  const out = [];
  result.blockLists.forEach(function (list) {
    if (!state.clean.blocksPresent.some(function (b) { return b === list.name; })) return;
    list.rows.forEach(function (row) {
      out.push({
        _sheet: list.name,
        name: row.name,
        share: formatShare(row.share),
        tgi: numCell(row.tgi, 2),
        R: '',
        Rstatus: '',
        S: list.hasRank ? numCell(row.S, 1) : '',
        P: list.hasRank ? numCell(row.P, 1) : '',
        composite: list.hasRank ? numCell(row.composite, 2) : '',
        rank: list.hasRank && isFiniteNumber(row.rank) ? row.rank : '',
        rankLo: list.hasRank ? row.rankLo : null,
        rankHi: list.hasRank ? row.rankHi : null,
        quad: list.hasRank ? row.qText + (list.smallSample ? '（样本较少）' : '') : '',
        interp: row.interp === '—' ? '' : row.interp
      });
    });
  });
  if (result.hasMixed) {
    result.mixed.rows.forEach(function (row) {
      out.push({
        _sheet: '二级混合总榜',
        name: row.name,
        share: formatShare(row.share),
        tgi: numCell(row.tgi, 2),
        R: isFiniteNumber(row.R) ? fmt(row.R, 1) + '%' : '',
        Rstatus: row.Rstatus || '',
        S: numCell(row.S, 1),
        P: numCell(row.P, 1),
        composite: numCell(row.composite, 2),
        rank: isFiniteNumber(row.rank) ? row.rank : '',
        rankLo: row.rankLo,
        rankHi: row.rankHi,
        quad: row.qText + (result.mixed.smallSample ? '（样本较少）' : ''),
        interp: row.interp === '—' ? '' : row.interp
      });
    });
  }
  return out;
}

/* 名次区间：权重在 0.3–0.7 间变化时的最好/最差名次；两端相同则只显示一个名次。 */
function rankRangeText(rec) {
  if (!isFiniteNumber(rec.rankLo) || !isFiniteNumber(rec.rankHi)) return '—';
  return rec.rankLo === rec.rankHi ? String(rec.rankLo) : rec.rankLo + '–' + rec.rankHi;
}

function exportCells(rec) {
  /* 关键词 / 榜单名称 / 分组名 不写进表格：文件名就是当前关键词，sheet 名就是榜单/分组名，
     行内再存一遍属于重复信息。 */
  var range = rankRangeText(rec);
  return [rec.name, rec.share, rec.tgi, rec.R, rec.Rstatus,
    rec.S, rec.P, rec.composite, rec.rank, range, rec.quad, rec.interp];
}

/* ---------------- 多 sheet Excel（OOXML .xlsx）导出 ---------------- */
/* 按区块分 sheet，每个 sheet 名为区块名（地域分布-城市 / 年龄分布 / … / 二级混合总榜）。
   用真正的 Office Open XML（.xlsx，ZIP 打包、STORED 不压缩），无需 CDN，
   二进制格式无编码歧义，Excel / WPS / Google Sheets 均能正常打开，
   避免 SpreadsheetML 文本在中文系统下被按 GBK 解析导致乱码。 */
function xmlEsc(s) {
  return String(s == null ? '' : s)
    /* XML 1.0 不允许 0x00-0x1F 控制字符（\t\n\r 除外），混入会让 Excel 判定文件损坏 */
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/\r/g, '&#13;').replace(/\n/g, '&#10;').replace(/\t/g, '&#9;');
}

function utf8Bytes(s) {
  return new TextEncoder().encode(String(s == null ? '' : s));
}

/* 列号转字母：1->A, 26->Z, 27->AA */
function colLetter(n) {
  var s = '';
  while (n > 0) {
    var m = (n - 1) % 26;
    s = String.fromCharCode(65 + m) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function xlsxSheetXml(headers, rows) {
  var xml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  xml += '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>';
  var all = [headers].concat(rows);
  for (var i = 0; i < all.length; i++) {
    var r = i + 1;
    xml += '<row r="' + r + '">';
    var cells = all[i];
    for (var j = 0; j < cells.length; j++) {
      var v = cells[j];
      if (v === null || v === undefined) v = '';
      if (typeof v === 'number' && !isFinite(v)) v = '';
      if (typeof v === 'number') {
        /* 数值列写成真正的数字单元格：Excel 里可直接排序 / 求和，且不会按文本规则比较（10 < 9） */
        xml += '<c r="' + colLetter(j + 1) + r + '"><v>' + v + '</v></c>';
        continue;
      }
      var sv = String(v);
      if (/^[=+\-@\t\r]/.test(sv)) sv = "'" + sv; /* 公式注入防护 */
      xml += '<c r="' + colLetter(j + 1) + r + '" t="inlineStr"><is><t xml:space="preserve">'
        + xmlEsc(sv) + '</t></is></c>';
    }
    xml += '</row>';
  }
  xml += '</sheetData></worksheet>';
  return xml;
}

/* CRC32（IEEE 802.3）查表，用于 ZIP 校验和：表只建一次，比逐位运算快约 8 倍 */
var CRC_TABLE = (function () {
  var t = new Uint32Array(256);
  for (var i = 0; i < 256; i++) {
    var c = i;
    for (var j = 0; j < 8; j++) c = (c >>> 1) ^ (0xEDB88320 & -(c & 1));
    t[i] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  var crc = 0xFFFFFFFF;
  for (var i = 0; i < bytes.length; i++) {
    crc = (crc >>> 8) ^ CRC_TABLE[(crc ^ bytes[i]) & 0xFF];
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function putU16(arr, off, v) { arr[off] = v & 0xFF; arr[off + 1] = (v >>> 8) & 0xFF; }
function putU32(arr, off, v) { arr[off] = v & 0xFF; arr[off + 1] = (v >>> 8) & 0xFF; arr[off + 2] = (v >>> 16) & 0xFF; arr[off + 3] = (v >>> 24) & 0xFF; }

/* 将多个文件打包成 ZIP（STORE，不压缩），返回 Uint8Array */
function zipStore(files) {
  var chunks = [];
  var centralDir = [];
  var offset = 0;
  files.forEach(function (f) {
    var nameBytes = utf8Bytes(f.name);
    var data = f.data;
    var crc = crc32(data);
    var nameLen = nameBytes.length;
    var lfh = new Uint8Array(30 + nameLen);
    lfh[0] = 0x50; lfh[1] = 0x4b; lfh[2] = 0x03; lfh[3] = 0x04;
    putU16(lfh, 4, 20);      /* version needed */
    putU16(lfh, 6, 0);       /* flags */
    putU16(lfh, 8, 0);       /* compression = STORED */
    putU16(lfh, 10, 0);      /* mod time */
    putU16(lfh, 12, 0);      /* mod date */
    putU32(lfh, 14, crc);
    putU32(lfh, 18, data.length);
    putU32(lfh, 22, data.length);
    putU16(lfh, 26, nameLen);
    putU16(lfh, 28, 0);      /* extra len */
    lfh.set(nameBytes, 30);
    chunks.push(lfh);
    chunks.push(data);

    var cde = new Uint8Array(46 + nameLen);
    cde[0] = 0x50; cde[1] = 0x4b; cde[2] = 0x01; cde[3] = 0x02;
    putU16(cde, 4, 20);      /* version made by */
    putU16(cde, 6, 20);      /* version needed */
    putU16(cde, 8, 0);
    putU16(cde, 10, 0);
    putU16(cde, 12, 0);
    putU16(cde, 14, 0);
    putU32(cde, 16, crc);
    putU32(cde, 20, data.length);
    putU32(cde, 24, data.length);
    putU16(cde, 28, nameLen);
    putU16(cde, 30, 0);      /* extra */
    putU16(cde, 32, 0);      /* comment */
    putU16(cde, 34, 0);      /* disk number */
    putU16(cde, 36, 0);      /* internal attrs */
    putU32(cde, 38, 0);      /* external attrs */
    putU32(cde, 42, offset);
    cde.set(nameBytes, 46);
    centralDir.push(cde);

    offset += lfh.length + data.length;
  });

  var cdSize = 0;
  for (var k = 0; k < centralDir.length; k++) cdSize += centralDir[k].length;

  var eocd = new Uint8Array(22);
  eocd[0] = 0x50; eocd[1] = 0x4b; eocd[2] = 0x05; eocd[3] = 0x06;
  putU16(eocd, 4, 0);
  putU16(eocd, 6, 0);
  putU16(eocd, 8, files.length);
  putU16(eocd, 10, files.length);
  putU32(eocd, 12, cdSize);
  putU32(eocd, 16, offset);
  putU16(eocd, 20, 0);

  var total = offset + cdSize + eocd.length;
  var out = new Uint8Array(total);
  var pos = 0;
  for (var a = 0; a < chunks.length; a++) { out.set(chunks[a], pos); pos += chunks[a].length; }
  for (var b = 0; b < centralDir.length; b++) { out.set(centralDir[b], pos); pos += centralDir[b].length; }
  out.set(eocd, pos);
  return out;
}

function bytesToBase64(bytes) {
  /* 分块转换：多 sheet 大表可达数 MB，逐字节累加字符串在移动端会很慢；
     按 8KB 分块后一次性 join，既快又不会触发调用栈上限。 */
  var parts = [];
  for (var i = 0; i < bytes.length; i += 8192) {
    var end = Math.min(i + 8192, bytes.length);
    var chunk = '';
    for (var j = i; j < end; j++) chunk += String.fromCharCode(bytes[j]);
    parts.push(chunk);
  }
  return btoa(parts.join(''));
}

function buildMultiSheetXlsx(result, records, headers) {
  /* 按 sheet 分组，顺序固定为 STANDARD_BLOCKS + 二级混合总榜。
     区块 sheet 去掉 R / R 判定两列（只有二级混合总榜有 R 值），混合总榜保留完整列。 */
  var R_IDX = headers.indexOf('R（相对父类占比）'); /* 第7列 */
  var RSTATUS_IDX = headers.indexOf('R 判定');      /* 第8列 */
  var blockColIdx = headers.map(function (_, i) { return i; })
    .filter(function (i) { return i !== R_IDX && i !== RSTATUS_IDX; });
  var blockHeaders = blockColIdx.map(function (i) { return headers[i]; });

  function pickCols(cells) {
    return blockColIdx.map(function (i) { return cells[i]; });
  }

  var sheetMap = {};
  records.forEach(function (r) {
    if (!sheetMap[r._sheet]) sheetMap[r._sheet] = [];
    sheetMap[r._sheet].push(r);
  });
  var sheets = [];
  STANDARD_BLOCKS.forEach(function (b) {
    if (sheetMap[b]) sheets.push({
      name: b,
      headers: blockHeaders,
      rows: sheetMap[b].map(exportCells).map(pickCols)
    });
  });
  if (sheetMap['二级混合总榜']) sheets.push({
    name: '二级混合总榜',
    headers: headers,
    rows: sheetMap['二级混合总榜'].map(exportCells)
  });

  var files = [];
  /* [Content_Types].xml */
  var ct = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>';
  sheets.forEach(function (s, i) {
    ct += '<Override PartName="/xl/worksheets/sheet' + (i + 1) + '.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
  });
  ct += '</Types>';
  files.push({ name: '[Content_Types].xml', data: utf8Bytes(ct) });

  /* _rels/.rels */
  files.push({ name: '_rels/.rels', data: utf8Bytes(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
    + '</Relationships>') });

  /* xl/workbook.xml */
  var wb = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '
    + 'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>';
  sheets.forEach(function (s, i) {
    wb += '<sheet name="' + xmlEsc(s.name) + '" sheetId="' + (i + 1) + '" r:id="rId' + (i + 1) + '"/>';
  });
  wb += '</sheets></workbook>';
  files.push({ name: 'xl/workbook.xml', data: utf8Bytes(wb) });

  /* xl/_rels/workbook.xml.rels */
  var wbr = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">';
  sheets.forEach(function (s, i) {
    wbr += '<Relationship Id="rId' + (i + 1) + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet' + (i + 1) + '.xml"/>';
  });
  wbr += '</Relationships>';
  files.push({ name: 'xl/_rels/workbook.xml.rels', data: utf8Bytes(wbr) });

  /* xl/worksheets/sheetN.xml */
  sheets.forEach(function (s, i) {
    files.push({ name: 'xl/worksheets/sheet' + (i + 1) + '.xml', data: utf8Bytes(xlsxSheetXml(s.headers, s.rows)) });
  });

  return zipStore(files);
}

function exportProgressNode(show, pct) {
  let node = el('exportProgress');
  if (!show) {
    if (node) node.remove();
    return;
  }
  if (!node) {
    node = document.createElement('div');
    node.id = 'exportProgress';
    node.className = 'card';
    node.innerHTML = '<div class="loading"><span class="spinner"></span><span>正在导出…</span></div>' +
      '<div class="progress-track"><div class="progress-bar" style="width:0"></div></div>';
    el('results').insertAdjacentElement('afterbegin', node);
  }
  const bar = node.querySelector('.progress-bar');
  if (bar) bar.style.width = pct + '%';
}

async function exportCSV() {
  const result = currentResult();
  if (!result || !hasValidRecords()) {
    showToast('当前关键词无有效数据，无法导出。');
    return;
  }
  const token = { gen: state.generation, keyword: state.currentKeyword };
  const records = buildExportRecords(result);
  if (records.length === 0) {
    showToast('当前关键词无有效数据，无法导出。');
    return;
  }
  const HEADERS = ['分类名', '原始占比', '原始TGI', 'R（相对父类占比）', 'R 判定',
    '规模分S（对数稳健标准化）', '偏好分P（对数稳健标准化）', '综合得分（几何合成）', '榜单内排名', '名次区间（权重0.3–0.7）', '四象限标签', '一句解读'];
  exportProgressNode(false, 0);
  if (token.gen !== state.generation || token.keyword !== state.currentKeyword) return;
  /* 按区块分 sheet 生成真正的 .xlsx（OOXML），避免全部区块挤在一张表里，且二进制格式无编码乱码问题。 */
  const xlsxBytes = buildMultiSheetXlsx(result, records, HEADERS);
  const safeName = String(state.currentKeyword || 'result').replace(/[\\/:*?"<>|\u0000-\u001F]/g, '_').slice(0, 80) || 'result';
  const fileName = '抖音指数_' + safeName + '_综合排名.xlsx';
  /* WebView 内 <a download> 不会真正落盘，优先交给原生桥写入系统下载目录；
     .xlsx 是二进制，用 base64 字符串传给原生侧解码，避免字符串桥损坏字节。
     在普通浏览器打开时退回 Blob 下载。 */
  if (window.DyRankingBridge && typeof window.DyRankingBridge.exportCsv === 'function') {
    try {
      window.DyRankingBridge.exportCsv(bytesToBase64(xlsxBytes), fileName);
      return;
    } catch (e) { /* 桥调用失败时退回浏览器下载 */ }
  }
  const blob = new Blob([xlsxBytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
}

/* ============================ 交互事件 ============================ */
function setCollapsed(collapsed) {
  state.collapsed = collapsed;
  el('control').classList.toggle('collapsed', collapsed);
  const ct = el('controlTips');
  if (ct) ct.hidden = collapsed;
  el('collapseBtn').textContent = collapsed ? '展开控制区' : '收起控制区';
  el('collapseBtn').setAttribute('aria-expanded', String(!collapsed));
  refreshSticky();
  if (state.status === 'success' && currentResult()) setupNav(currentResult(), true);
}

function bindEvents() {
  el('sampleBtn').addEventListener('click', loadSample);
  el('reanalyzeBtn').addEventListener('click', function () {
    if (!state.clean) { showToast('尚未载入数据，请返回抓取后重试'); return; }
    state.resultCache.delete(state.currentKeyword);
    analyzeKeyword(state.currentKeyword, { resetScroll: true });
  });
  el('exportBtn').addEventListener('click', exportCSV);
  el('clearBtn').addEventListener('click', clearAll);

  el('collapseBtn').addEventListener('click', function () { setCollapsed(!state.collapsed); });

  el('kwSelect').addEventListener('change', function (e) {
    const kw = e.target.value;
    if (!kw || kw === state.currentKeyword) return;
    clearError();
    analyzeKeyword(kw, { resetScroll: true });
  });

  el('resultNav').addEventListener('click', function (e) {
    const a = e.target.closest('a[data-target]');
    if (!a) return;
    e.preventDefault();
    const node = el(a.getAttribute('data-target'));
    if (!node) return;
    const top = node.getBoundingClientRect().top + window.scrollY - stickyOffset() - 8;
    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  });

  let resizeTimer = null;
  window.addEventListener('resize', function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      refreshSticky();
      if (state.status === 'success' && currentResult()) setupNav(currentResult(), true);
    }, 120);
  });
}

/* ============================ 内置 CSV 解析（RFC4180，无第三方依赖） ============================ */
/* Android 端注入的是已生成好的 CSV 文本（区块,分类,占比,TGI，\r\n 分行，含逗号/引号字段会被双引号包裹），
   故无需 PapaParse/SheetJS，自实现一个最小解析器即可。支持 BOM、\r\n/\n、双引号转义。 */
function parseCsvText(text) {
  if (text === null || text === undefined) return [];
  let s = String(text);
  if (s.charCodeAt(0) === 0xFEFF) s = s.slice(1);
  const rows = [];
  let row = [];
  let field = '';
  let inQuotes = false;
  let i = 0;
  const n = s.length;
  while (i < n) {
    const c = s.charAt(i);
    if (inQuotes) {
      if (c === '"') {
        if (s.charAt(i + 1) === '"') { field += '"'; i += 2; continue; }
        inQuotes = false; i++; continue;
      }
      field += c; i++; continue;
    }
    if (c === '"' && field === '') { inQuotes = true; i++; continue; }
    if (c === ',') { row.push(field); field = ''; i++; continue; }
    if (c === '\r') {
      if (s.charAt(i + 1) === '\n') i++;
      row.push(field); field = ''; rows.push(row); row = []; i++; continue;
    }
    if (c === '\n') {
      row.push(field); field = ''; rows.push(row); row = []; i++; continue;
    }
    field += c; i++;
  }
  /* 最后一行若无换行结尾也要收进来；但整行只有空字段且前面已闭合则不收 */
  if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
  return rows;
}

/* 原生端在页面加载完成后调用：直接把抓取到的 CSV 文本灌入排名工具。 */
window.loadFromCsv = function (csvText, sourceName, pageType) {
  try {
    /* 原生可能在上一份数据还在读取/解析时再次注入：先作废旧回调（令牌 + 中断 FileReader），
       否则旧表的 processTable 会把刚注入的新数据覆盖掉。 */
    state.generation += 1;
    if (state.activeReader) {
      try { state.activeReader.abort(); } catch (e) { /* ignore */ }
      state.activeReader = null;
    }
    resetForNewData();
    clearError();
    state.pageType = pageType || '';
    const rows = parseCsvText(csvText);
    if (!rows.length) {
      showError('注入的 CSV 为空，无法分析。');
      setStatus('error');
      return;
    }
    const src = sourceName || '抖音指数抓取结果';
    state.file = { name: src, size: String(csvText).length, sample: false };
    // nativeName：src 是抓取侧回传的最终页名（与状态栏同源），不要再按文件名规则二次截断。
    const table = buildTable(rows, { fileName: src, source: src, nativeName: true, totalRows: rows.length - 1, extraCols: 0 });
    processTable(table);
  } catch (e) {
    showError('CSV 解析失败：' + String(e && e.message ? e.message : e));
    setStatus('error');
  }
};

/* 原生端可在注入前把数据挂到 window，init 时自动载入（省去 evaluateJavascript 的时序等待）。 */
window.__autoLoadRanking = function () {
  const p = window.__rankingPayload;
  if (p && typeof p.csv === 'string' && p.csv.length > 0) {
    window.loadFromCsv(p.csv, p.keyword || '', p.pageType || '');
  }
};

function init() {
  setCollapsed(true);
  bindEvents();
  /* 「返回抓取」走原生桥关闭本 Activity；浏览器直开时退回历史。 */
  const backBtn = el('backBtn');
  if (backBtn) {
    backBtn.addEventListener('click', function () {
      if (window.DyRankingBridge && typeof window.DyRankingBridge.close === 'function') {
        try { window.DyRankingBridge.close(); return; } catch (e) { /* fallthrough */ }
      }
      if (window.history.length > 1) window.history.back();
    });
  }
  refreshSticky();
  setStatus('idle');
  /* 原生端已预挂载数据则立即载入；否则等待 evaluateJavascript 调用 loadFromCsv。 */
  if (window.__rankingPayload) {
    window.__autoLoadRanking();
  }
}

init();
</script>
