// 应用模块：抖音指数人群分析自动抓取工具。
// 纯 Android 框架实现，运行时零第三方依赖。
plugins {
    id 'com.android.application'
}

// ===== release 签名配置 =====
// 签名信息来自根目录 keystore.properties（与 keystore 文件一起保管，均被 .gitignore 排除）。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasKeystoreProps = keystorePropsFile.exists()
if (hasKeystoreProps) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def REQUIRED_KEYS = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def missingKeys = REQUIRED_KEYS.findAll {
    !keystoreProps[it]?.toString()?.trim()
}

def SIGNING_HINT = '''
————————————————————————————————————————————————————————————
release 签名配置缺失，已中止构建（避免产出未签名的 APK）。

需要工程根目录下的两个文件（二者均被 .gitignore 排除，不进版本库）：
  1) keystore.properties —— 含 4 项：storeFile / storePassword / keyAlias / keyPassword
  2) storeFile 指向的 keystore 文件（如 release.jks）

本机：从安全位置恢复上述两个文件后重试。
CI  ：在仓库 Settings → Secrets and variables → Actions 配置
      SIGNING_KEYSTORE_BASE64 / SIGNING_STORE_PASSWORD /
      SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD，
      workflow 会还原为这两个文件（见 .github/workflows/release.yml）。
————————————————————————————————————————————————————————————
'''

// ===== 版本号（每次提交自动递增，无需人工改文件） =====
// 规则：versionName = 基础版本 + "." + 提交数，versionCode = 25 + 提交数。
//   - 基础版本（语义版本）只在大版本变更时手改 VERSION_NAME_BASE；
//   - 提交数取 git rev-list --count HEAD，本地与 CI 完全一致，单调递增；
//   - CI 若为浅克隆，可由 workflow 通过 DYINDEX_BUILD_NUMBER 传入同一数值，
//     保证 APK 版本与 PWA / 用户脚本版本（tools/build-pwa.js 用同一算法）对齐；
//   - 因此「推送到 main」即产生一个比上一版更新的 APK，Updater 能正常提示升级。
def VERSION_NAME_BASE = '1.11.1'
def dyBuildNumber = 0
def envBuild = System.getenv('DYINDEX_BUILD_NUMBER')
if (envBuild != null && envBuild.trim().isInteger()) {
    dyBuildNumber = envBuild.trim().toInteger()
} else {
    try {
        def proc = new ProcessBuilder('git', 'rev-list', '--count', 'HEAD')
            .directory(rootProject.projectDir).redirectErrorStream(true).start()
        def out = proc.inputStream.getText('UTF-8').trim()
        proc.waitFor()
        if (out.isInteger()) dyBuildNumber = out.toInteger()
    } catch (Exception ignored) {
        // 没有 git 环境（例如从压缩包构建）时退回 0，不阻断构建
    }
}

def VERSION_NAME_FULL = dyBuildNumber > 0 ? (VERSION_NAME_BASE + '.' + dyBuildNumber) : VERSION_NAME_BASE

android {
    namespace 'com.lmt.dyindex'
    compileSdk 34

    defaultConfig {
        applicationId "com.lmt.dyindex"
        minSdk 26
        targetSdk 34
        versionCode(25 + dyBuildNumber)
        versionName(VERSION_NAME_FULL)
    }

    signingConfigs {
        release {
            if (hasKeystoreProps && missingKeys.isEmpty()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // 用 release keystore 签名，产物可直接安装并支持后续同签名覆盖升级。
            // 缺配置时不绑定签名，由下方 taskGraph 检查直接中止构建。
            if (hasKeystoreProps && missingKeys.isEmpty()) {
                signingConfig signingConfigs.release
            }
            // WebView 外壳无需混淆；proguard-rules.pro 中的 keep 规则是「日后开启混淆」的前置保险。
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 请求 release 产物但签名配置不全时立即失败，给出可操作的提示，
// 而不是静默产出一个未签名、无法覆盖安装的 APK。
// 注意：只在 release 构建时校验，debug 构建不受影响（便于无密钥的机器直接编译调试）。
gradle.taskGraph.whenReady { graph ->
    boolean wantsRelease = graph.allTasks.any { t ->
        t.project == project && (t.name ==~ /(assemble|bundle|package).*Release.*/)
    }
    if (!wantsRelease) return

    if (!hasKeystoreProps) {
        throw new GradleException(SIGNING_HINT)
    }
    if (!missingKeys.isEmpty()) {
        throw new GradleException("keystore.properties 缺少字段：" + missingKeys.join('、') + SIGNING_HINT)
    }
    def ksFile = rootProject.file(keystoreProps['storeFile'])
    if (!ksFile.exists()) {
        throw new GradleException("keystore 文件不存在：" + ksFile.absolutePath + SIGNING_HINT)
    }
}

dependencies {
    // 运行时零第三方依赖：仅框架 API。
    // JUnit 只进测试编译期（testImplementation），不会打进 APK，不破坏零依赖约定。
    testImplementation 'junit:junit:4.13.2'
}
