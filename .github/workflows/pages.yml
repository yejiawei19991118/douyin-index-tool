name: PWA

# 把排名页转换成 PWA 并发布到 GitHub Pages（iPhone Safari 添加到主屏后可全屏、离线使用）。
# 除纯文档外的任何推送（含 APK 的 ranking.html / scoring.js / extract.js / AppUrls.java）
# 都会重新构建并发布，用户脚本与 PWA 因此始终跟着 APK 一起升级。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建 PWA 产物
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 本地构建号取自 git 提交数，需要完整历史；CI 里优先用运行号
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 转换排名页为 PWA
        run: node tools/build-pwa.js

      # 发布前自检：任一关键文件缺失或注入失效都不发布
      - name: 产物自检
        run: |
          set -euo pipefail
          for f in index.html scoring.js web-boot.js web.css manifest.webmanifest \
                   sw.js douyin-index-extract.user.js \
                   icons/icon-192.png icons/icon-512.png icons/icon-180.png; do
            test -s "pwa-dist/$f" || { echo "::error::缺少 pwa-dist/$f"; exit 1; }
          done
          grep -q 'rel="manifest"' pwa-dist/index.html || { echo "::error::index.html 未注入 manifest"; exit 1; }
          grep -q 'src="web-boot.js"' pwa-dist/index.html || { echo "::error::index.html 未注入启动脚本"; exit 1; }
          grep -q '@match.*creator\.douyin\.com' pwa-dist/douyin-index-extract.user.js \
            || { echo "::error::用户脚本缺少 creator.douyin.com 匹配规则"; exit 1; }
          grep -q 'window.__dyRun' pwa-dist/douyin-index-extract.user.js \
            || { echo "::error::用户脚本未包含抓取实现"; exit 1; }
          grep -q '@version      [0-9]' pwa-dist/douyin-index-extract.user.js \
            || { echo "::error::用户脚本缺少版本号，扩展不会自动更新"; exit 1; }
          grep -q 'dyrank-pwa-[0-9]' pwa-dist/sw.js \
            || { echo "::error::Service Worker 缓存名未注入构建版本"; exit 1; }
          grep -q 'name="dyrank-version"' pwa-dist/index.html \
            || { echo "::error::PWA 页面缺少构建版本标记"; exit 1; }
          echo "PWA 产物自检通过"

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: pwa-dist

  deploy:
    name: 部署到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
